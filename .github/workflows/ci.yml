name: CI
on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    uses: status-im/nimbus-common-workflow/.github/workflows/common.yml@main
    with:
      test-command: |
        nimble setup -l
        nim c -r --threads:on -d:jsonRpcStdioTrace tests/test_stdio_transport.nim || true

